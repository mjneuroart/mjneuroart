<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="16" viewBox="0 0 1200 16" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c5ee0" stop-opacity="0"/><stop offset="0.5" stop-color="#e8a94e"/><stop offset="1" stop-color="#7b5fd6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="8" x2="1200" y2="8" stroke="#4c5ee0" stroke-opacity="0.35"/>
  <rect x="-220" y="7" width="220" height="2" fill="url(#pulse)">
    <animate attributeName="x" values="-220;1200" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="4" width="6" height="8" fill="#e8a94e"/><rect x="1194" y="4" width="6" height="8" fill="#e8a94e"/>
</svg>
