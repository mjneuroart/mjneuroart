# pages — publishes docs/ (the "terminal" page) to GitHub Pages.
# First run enables Pages on the repo (source: GitHub Actions), every later
# push to main that touches docs/ redeploys. Own repo, own content: allowed.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: enable Pages if needed, then configure
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: package docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
