# pages — keeps the gh-pages branch equal to docs/ (the "terminal" page).
# GitHub enabled Pages on its own the first time gh-pages was pushed (it does
# that for a project site); the workflow token cannot enable Pages itself
# (no administration right), so the branch is the source, not docs/ on main.
# Own repo, own content: allowed.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: push docs/ to gh-pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: docs
          jekyll: false
          commit_message: "pages: sync docs/ from main"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
