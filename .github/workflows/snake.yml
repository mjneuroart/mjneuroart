# snake — draws the contribution graph as a snake animation, every night,
# on the `output` branch. Palette: indigo dots, gold snake, like the banner.
# Two third-party actions (Platane/snk, crazy-max/ghaction-github-pages):
# the standard recipe from the snk README. Own repo, own graph: allowed.
name: snake

on:
  schedule:
    - cron: "41 5 * * *"   # 05:41 UTC, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: mjneuroart
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#c98a2c&color_dots=#ebedf0,#c7cdf5,#8e9df0,#4c5ee0,#7b5fd6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e8a94e&color_dots=#161b22,#26306e,#3546c8,#4c5ee0,#7b5fd6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
