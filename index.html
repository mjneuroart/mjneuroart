<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mjneuroart // terminal</title>
<meta name="description" content="mjneuroart. MJ, neuro, art. Paris. Generative since 2022. Builds with agents.">
<meta property="og:title" content="mjneuroart // terminal">
<meta property="og:description" content="MJ · neuro · art. Paris. Generative since 2022.">
<meta property="og:image" content="social-preview.png">
<meta name="theme-color" content="#050508">
<style>
  /* Big Shoulders Display, IBM Plex Mono, Noto Sans JP (subset): all SIL Open Font License */
  @font-face{font-family:"Big Shoulders";src:url(bigshoulders-900.woff2) format("woff2");font-weight:900;font-display:swap}
  @font-face{font-family:"Plex Mono";src:url(plexmono-500.woff2) format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"Plex Mono";src:url(plexmono-700.woff2) format("woff2");font-weight:700;font-display:swap}
  @font-face{font-family:"Noto JP Sub";src:url(notosansjp-700-subset.woff2) format("woff2");font-weight:700;font-display:swap}
  :root{--bg:#050508;--ink:#f4f2ff;--muted:#8d8aa8;--readout:#c9c4e6;--indigo:#4c5ee0;--violet:#7b5fd6;--gold:#e8a94e;--coral:#e0564b;
        --mono:"Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--display:"Big Shoulders","Arial Narrow",Impact,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden}
  canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  .art{position:fixed;top:0;right:0;height:100%;width:min(58vw,100%);z-index:1;pointer-events:none}
  .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 40%;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%,#000 100%);mask-image:linear-gradient(90deg,transparent 0,#000 34%,#000 100%)}
  .lock{position:absolute;left:62.5%;top:31.9%;width:52px;height:52px;transform:translate(-50%,-50%)}
  .lock i{position:absolute;width:12px;height:12px;border:1.5px solid var(--gold)}
  .lock i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.lock i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
  .lock i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.lock i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
  .lock b{position:absolute;inset:6px;border:1px dashed var(--indigo);border-radius:50%;animation:spin 16s linear infinite}
  .lock span{position:absolute;left:64px;top:-14px;font:10px/1 var(--mono);letter-spacing:3px;color:var(--gold);white-space:nowrap}
  .mark{position:fixed;left:14vw;bottom:-2vw;z-index:1;font:900 26vw/1 "Noto JP Sub",sans-serif;color:var(--indigo);opacity:.07;pointer-events:none;user-select:none}
  main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,6vw,96px);max-width:66vw}
  .label{font:12px/1.7 var(--mono);letter-spacing:3.5px;color:var(--muted);text-transform:uppercase}
  .jp{margin-top:14px;font:700 15px/1 "Noto JP Sub",sans-serif;letter-spacing:5px;color:var(--muted)}
  .jp small{font:11px/1 var(--mono);letter-spacing:4px;margin-left:12px}
  h1{position:relative;isolation:isolate;margin:.04em 0 0;font-family:var(--display);font-weight:900;font-size:clamp(64px,13.5vw,210px);letter-spacing:.02em;line-height:.9;text-transform:uppercase;animation:jit 3.1s steps(1) infinite}
  h1::before,h1::after{content:attr(data-t);position:absolute;left:0;top:0;pointer-events:none;z-index:-1}
  h1::before{color:var(--indigo);animation:g1 2.6s infinite steps(1)}
  h1::after{color:var(--gold);animation:g2 2.6s infinite steps(1)}
  .rule{height:3px;width:0;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:rule 5s ease-in-out infinite;margin:14px 0 16px}
  .tag{position:relative;display:inline-block;font:700 clamp(12px,1.3vw,16px)/1 var(--mono);letter-spacing:5px;color:var(--gold);text-transform:uppercase}
  .tag::after{content:"";position:absolute;left:0;top:45%;height:2px;width:0;background:var(--coral);animation:strike 8s steps(1) infinite}
  pre{margin:36px 0 0;font:500 13px/1.65 var(--mono);letter-spacing:1.5px;color:var(--readout);white-space:pre-wrap}
  pre .c{display:inline-block;width:8px;height:13px;background:var(--gold);vertical-align:-2px;animation:blink .9s steps(1) infinite}
  .hz{margin-top:14px;height:7px;width:min(360px,60%);background:repeating-linear-gradient(-45deg,var(--gold) 0 8px,transparent 8px 16px);animation:hz .8s linear infinite;opacity:.9}
  nav{margin-top:28px;font:13px/1 var(--mono);letter-spacing:3px;text-transform:uppercase}
  nav a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--indigo);padding-bottom:3px;margin-right:22px}
  nav a:hover{color:var(--gold);border-color:var(--gold)}
  .frame{position:fixed;inset:14px;border:1px solid rgba(232,169,78,.32);z-index:3;pointer-events:none}
  .frame::before{content:"";position:absolute;left:0;top:-1px;height:1px;width:160px;background:var(--gold);animation:run 7s linear infinite}
  .corner{position:fixed;width:22px;height:22px;border:2px solid var(--indigo);z-index:3;animation:brk 3s infinite}
  .corner.tl{left:22px;top:22px;border-right:0;border-bottom:0}.corner.tr{right:22px;top:22px;border-left:0;border-bottom:0}
  .corner.bl{left:22px;bottom:22px;border-right:0;border-top:0}.corner.br{right:22px;bottom:22px;border-left:0;border-top:0}
  .ruler{position:fixed;left:60px;right:60px;top:14px;height:9px;z-index:3;background:repeating-linear-gradient(90deg,rgba(141,138,168,.55) 0 1px,transparent 1px 20px);pointer-events:none}
  .edge{position:fixed;z-index:3;font:10px/1 var(--mono);letter-spacing:4px;color:var(--muted);text-transform:uppercase;white-space:nowrap}
  .edge.l{left:28px;bottom:90px;writing-mode:vertical-rl;transform:rotate(180deg)}
  .edge.r{right:28px;top:90px;writing-mode:vertical-rl}
  .scan{position:fixed;left:0;right:0;height:60px;top:-60px;background:linear-gradient(transparent,rgba(244,242,255,.07),transparent);z-index:3;animation:scan 6s linear infinite;pointer-events:none}
  .lines{position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1.5px,transparent 1.5px 3px);z-index:3;pointer-events:none}
  .grain{position:fixed;inset:0;z-index:3;opacity:.06;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
  .handle{position:fixed;right:58px;bottom:26px;font:12px/1 var(--mono);letter-spacing:3px;color:var(--muted);z-index:3}
  .bar{position:fixed;right:60px;bottom:48px;height:18px;width:140px;z-index:3;opacity:.8;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 5px,var(--ink) 5px 6px,transparent 6px 9px,var(--ink) 9px 11px,transparent 11px 13px)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rule{0%{width:0}40%{width:min(640px,86%)}80%{width:min(640px,86%)}100%{width:0}}
  @keyframes blink{50%{opacity:0}}
  @keyframes brk{0%,100%{opacity:1}35%{opacity:.35}}
  @keyframes scan{to{top:100%}}
  @keyframes run{to{left:calc(100% - 160px)}}
  @keyframes hz{to{background-position:16px 0}}
  @keyframes strike{0%,39%{width:0}40%,59%{width:11.5ch}60%,100%{width:0}}
  @keyframes jit{0%,100%{transform:translate(0)}31%{transform:translate(-3px,0)}33%{transform:translate(0)}67%{transform:translate(2px,0)}69%{transform:translate(0)}}
  @keyframes g1{0%,100%{clip-path:inset(0 0 62% 0);transform:translate(-5px,0);opacity:.9}8%{clip-path:inset(12% 0 50% 0);transform:translate(-12px,0)}16%{clip-path:inset(40% 0 30% 0);transform:translate(7px,0);opacity:.5}24%{clip-path:inset(0 0 62% 0);transform:translate(-5px,0)}52%{clip-path:inset(55% 0 10% 0);transform:translate(-16px,0)}60%{clip-path:inset(0 0 62% 0);transform:translate(-5px,0);opacity:.9}}
  @keyframes g2{0%,100%{clip-path:inset(62% 0 0 0);transform:translate(5px,0);opacity:.85}12%{clip-path:inset(30% 0 40% 0);transform:translate(13px,0)}20%{clip-path:inset(62% 0 0 0);transform:translate(5px,0);opacity:.4}44%{clip-path:inset(5% 0 75% 0);transform:translate(-9px,0)}50%{clip-path:inset(62% 0 0 0);transform:translate(5px,0)}78%{clip-path:inset(45% 0 20% 0);transform:translate(18px,0);opacity:.9}84%{clip-path:inset(62% 0 0 0);transform:translate(5px,0)}}
  @media (max-width:820px){
    main{max-width:100%;justify-content:flex-end;padding-bottom:64px}
    .art{width:100%;height:58vh}
    .art img{-webkit-mask-image:linear-gradient(180deg,#000 0,#000 60%,transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 60%,transparent 100%)}
    h1{font-size:clamp(44px,15vw,110px)}
    pre{margin-top:18px;font-size:11px;letter-spacing:.5px}
    .tag{font-size:11px;letter-spacing:3px}
    .edge,.bar,.mark{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    h1,h1::before,h1::after,.rule,.scan,.corner,.lock b,pre .c,.hz,.frame::before,.tag::after{animation:none}
    .rule{width:min(640px,86%)}
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<div class="art" aria-hidden="true">
  <img src="face.jpg" alt="">
  <div class="lock"><i></i><i></i><i></i><i></i><b></b><span>IRIS · SYNC</span></div>
</div>
<div class="mark" aria-hidden="true" lang="ja">電脳</div>

<div class="frame"></div>
<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
<div class="ruler"></div>
<div class="edge l">Neural link // est. 2022 // Paris</div>
<div class="edge r">MJ // neuro // art</div>
<div class="scan"></div><div class="lines"></div><div class="grain"></div>
<div class="bar" aria-hidden="true"></div>
<div class="handle">@mjneuroart</div>

<main>
  <div class="label">MJ // neuro // art<br>Est. 2022 · Paris</div>
  <div class="jp" lang="ja">ニューロアート<small lang="en">// NEURO ART</small></div>
  <h1 data-t="MJNEUROART">MJNEUROART</h1>
  <div class="rule"></div>
  <div class="tag">Neural tools · Artist eye · Agents</div>
  <pre id="out" aria-live="polite"></pre>
  <div class="hz" aria-hidden="true"></div>
  <nav>
    <a href="https://github.com/mjneuroart">github</a>
    <a href="https://x.com/Jeason4X">x</a>
  </nav>
</main>

<script>
(function(){
  // boot readout, typed line by line. DAY = days since the GitHub account opened (2023-11-17).
  var epoch = new Date(Date.UTC(2023, 10, 17));
  var now = new Date();
  var day = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - epoch.getTime()) / 864e5);
  var date = now.toISOString().slice(0, 10);
  var lines = [
    '> neural.link ........... OK',
    '> agents.spawn .......... READY',
    '> uplink ................ DAY ' + day + ' · ' + date,
    '> status ................ ONLINE · PARIS'
  ];
  var out = document.getElementById('out');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { out.textContent = lines.join('\n'); return; }
  var li = 0, ci = 0, text = '';
  function tick(){
    if (li >= lines.length) { out.innerHTML = text.replace(/</g,'&lt;') + '<span class="c"></span>'; return; }
    text += lines[li].charAt(ci); ci++;
    if (ci > lines[li].length) { text += '\n'; li++; ci = 0; }
    out.innerHTML = text.replace(/</g,'&lt;') + '<span class="c"></span>';
    setTimeout(tick, ci === 0 ? 260 : 18);
  }
  setTimeout(tick, 500);

  // background: drifting data streaks and sparks, indigo / gold / white.
  var cv = document.getElementById('bg'), ctx = cv.getContext('2d'), W, H, streaks = [], sparks = [];
  var cols = ['#4c5ee0', '#7b5fd6', '#e8a94e', '#f4f2ff'];
  function size(){ W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
  function mk(){ return { x: -Math.random()*W, y: Math.random()*H, w: (120+Math.random()*420)*devicePixelRatio, h: (1+Math.random()*4)*devicePixelRatio, v: (0.4+Math.random()*1.6)*devicePixelRatio, c: cols[Math.random()*cols.length|0], a: 0.15+Math.random()*0.5 }; }
  function sp(){ return { x: Math.random()*W, y: Math.random()*H, r: (0.6+Math.random()*1.6)*devicePixelRatio, t: Math.random()*6.28 }; }
  size(); addEventListener('resize', size);
  for (var i=0;i<16;i++) streaks.push(mk());
  for (var j=0;j<60;j++) sparks.push(sp());
  function frame(){
    ctx.clearRect(0,0,W,H);
    streaks.forEach(function(s){
      var g = ctx.createLinearGradient(s.x,0,s.x+s.w,0);
      g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(0.5,s.c); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha = s.a; ctx.fillStyle = g; ctx.fillRect(s.x, s.y, s.w, s.h);
      s.x += s.v; if (s.x > W) { var n = mk(); n.x = -n.w; s.x = n.x; s.y = n.y; s.w = n.w; s.h = n.h; s.v = n.v; s.c = n.c; s.a = n.a; }
    });
    ctx.globalAlpha = 1;
    sparks.forEach(function(p){ p.t += 0.03; ctx.fillStyle = 'rgba(244,242,255,' + (0.25+0.5*Math.abs(Math.sin(p.t))) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill(); });
    if (!reduce) requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
